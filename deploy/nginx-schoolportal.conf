# SchoolPortal — subpath /school on a shared Ubuntu host
#
# 1) Publish static files under html/school/ (see docs/DEPLOY_UBUNTU_PRODUCTION.md)
# 2) Include this file inside your server { } block:
#      include /var/www/schoolportal/deploy/nginx-schoolportal.conf;
#
# API listens on 127.0.0.1:5341 (set PORT in .env). Change below if you use another port.

map $uri $schoolportal_spa {
    default 0;
    ~^/school/(login|dashboard|apply|paystack|students|classes|admissions|attendance|learn|lms|teachers|finance|hr|library|access|ancillary|promotion|id-cards|community|settings|messages|children|gradebook|exams|services|campus)(/|$) 1;
}

location /school/api/ {
    proxy_pass http://127.0.0.1:5341/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;
}

location /school/uploads/ {
    proxy_pass http://127.0.0.1:5341/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Static UI: files live in /var/www/schoolportal/web/html/school/
location /school/ {
    root /var/www/schoolportal/web/html;
    try_files $uri $uri/ @schoolportal_fallback;
}

location @schoolportal_fallback {
    root /var/www/schoolportal/web/html;
    if ($schoolportal_spa = 1) {
        rewrite ^ /school/portal.html break;
    }
    rewrite ^ /school/index.html break;
}
