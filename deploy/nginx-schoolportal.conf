# SchoolPortal — subpath /school on a shared Ubuntu host
#
# Two PM2 processes sit behind nginx:
#   - schoolportal-api : Express API on 127.0.0.1:3900
#   - schoolportal-web : Vite preview server on 127.0.0.1:3905 (serves web/dist)
#
# Include this file inside your server { } block:
#   include /etc/nginx/snippets/schoolportal.conf;
#
# If you change ports, update them in .env (PORT=3900), ecosystem.config.cjs,
# web/vite.config.ts (preview.port=3905), and here.

# API → backend (strip the /school prefix)
location /school/api/ {
    proxy_pass http://127.0.0.1:3900/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25M;
}

# Uploaded files → backend
location /school/uploads/ {
    proxy_pass http://127.0.0.1:3900/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else under /school → frontend (Vite preview, keeps the /school path)
location /school/ {
    proxy_pass http://127.0.0.1:3905;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
